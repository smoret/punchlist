# Builds the package and publishes it with PyPI trusted publishing (no stored token).
# A v* tag publishes to PyPI; running the workflow by hand publishes to TestPyPI.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: python -m pip install build
      - run: python -m build
      # Fail closed: a tag that disagrees with pyproject.toml's version publishes nothing.
      - name: Check the wheel installs and matches the tag
        run: |
          python -m pip install dist/*.whl
          punch --version
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$(punch --version)" != "punch ${GITHUB_REF_NAME#v}" ]; then
            echo "tag $GITHUB_REF_NAME does not match the package version" >&2
            exit 1
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  testpypi:
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/project/punchlist/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          # A trial run can repeat a version already on TestPyPI; that's not a failure.
          skip-existing: true

  pypi:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/punchlist/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
