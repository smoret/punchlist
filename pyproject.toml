[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "punchlist"
version = "0.5.0"
description = "A file-based issue tracker: one markdown file per issue, in the project's own git repo"
authors = [
    { name = "Steven Moret", email = "smoret@gmail.com" },
]
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest",
    "pylint",
    "pyright",
]

[project.scripts]
punch = "punchlist.cli:main"
punchlist = "punchlist.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["punchlist*"]

[tool.setuptools.package-data]
# The board page `punch serve` sends.
punchlist = ["static/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Tests import shared helpers as `from helpers import ...`.
pythonpath = ["tests"]

[tool.pyright]
extraPaths = ["tests"]

[tool.pylint.basic]
# http.server dispatches a request to the handler method named do_<METHOD>.
good-names-rgxs = ["^do_[A-Z]+$"]

[tool.pylint."messages control"]
# Complexity metrics are refactor-time signals, not defects.
disable = [
    "too-many-arguments",
    "too-many-branches",
    "too-many-instance-attributes",
    "too-many-locals",
    "too-many-positional-arguments",
    "too-many-return-statements",
    "too-many-statements",
    "too-few-public-methods",
]
